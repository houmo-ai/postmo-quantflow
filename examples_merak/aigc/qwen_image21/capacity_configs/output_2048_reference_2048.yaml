# Configuration example; full-weight 4MP export/runtime accuracy is not verified.
# Retain a 2048-square reference and generate a 2048-square output.
quant: null
export:
  model_id: qwen-image-2.1-turbo
  model:
    type: XHQwenImage21Model
    quant_scheme:
      target_device: XH2a
      quant_type: w8a8_sefp
  target_device: XH2a
  output_size: [2048, 2048]
  reference_size: [2048, 2048]
  canvas_size: [2048, 2048]
  target_capacity: 16384
  reference_capacity: 16384
  visual_patch_capacity: 16384
  prompt_budget: 512
  max_references: 1
  max_position: 32768
