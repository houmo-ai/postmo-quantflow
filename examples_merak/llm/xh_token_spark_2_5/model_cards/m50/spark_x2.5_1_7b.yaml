    # prefill 按 2048 tokens（8 次 256-token 导出图调用）；decode 按单次 1 token。
    # MAC=2；仅计 Linear、MatMul、GroupMatMul 和 FlashAttention 的 QKᵀ/AV。
    # 按静态形状：全注意力 KV=2048，滑窗 KV=prefill 768 / decode 512；不扣除 mask。
    # 不计归一化、RoPE、激活、逐元素、量化及访存开销；这是主要算术量估计。
    # 2048-token prefill 按 8 次调用的同口径上界估计为 6.409970253824 TFLOPs。
    # 图路径、SHA256、公式及分项：spark_x2.5_1_7b.compute.json。
    input_shape: [1, 2048]
    prefill: 6.409970253824
    decode: 0.003620601856
    unit: TFLOPs
    status: inferred
