  presentation:
    summary: PaddleOCR-VL 1.6 在 XH2a 上的文档 OCR 部署，语言和 Vision encoder 使用 QuaRot + AutoRound GPTQ W8 权重，语言激活使用 W8A8-SEFP，Vision 激活使用 W8A16H1-SEFP。
    demo:
      kind: command
      entrypoint: examples_merak/llm/paddleocr_vl/evaluate_cases.py
    limitations:
    - 卡片登记的现有 HMONNX 是历史精确分辨率 ABI；token-gear 实现需要重新导出产物后才能用于动态 patch grid。
    - 134 个锚点是部分人工标注，不能代表完整生产文档集的 CER、WER 或表格准确率。
    - 银行区域已标注单元格为 35/37 精确匹配，菜单和手写案例仍存在误识别。
    - Vision W8A8-SEFP 在两个整页案例发生重复生成，因此交付配置固定使用 Vision W8A16H1-SEFP。
    evidence:
      examples:
      - examples_merak/llm/paddleocr_vl
      readme:
      - examples_merak/llm/paddleocr_vl/README.md
