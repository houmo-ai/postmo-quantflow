      type: tensor
      dtype: int64
      required: true
      description: 处理后的文本与图像占位 token。
    - name: image_embeddings
      type: tensor
      dtype: float16
      required: true
      description: Vision encoder 和跨模态 projector 生成的图像特征。
    outputs:
    - name: logits
      type: tensor
      dtype: float16
      required: true
      description: 自回归生成 logits。
