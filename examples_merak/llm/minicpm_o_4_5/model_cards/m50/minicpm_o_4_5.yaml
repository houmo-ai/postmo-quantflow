      status: missing
  presentation:
    summary: >-
      MiniCPM-o 4.5 XH2a omni-modal workflow for text, image, video and
      audio understanding plus speech generation. The validated W4A8 release
      uses a W4A8 LLM backbone and component-specific W8A8/W8A16 precision,
      with separate offline, session and duplex-stream artifact families.
    demo:
      kind: cli
    limitations:
    - One export artifact serves exactly one runtime family; offline, session and duplex-stream artifacts are not interchangeable.
    - The validated LLM graph uses a 32768-token context limit and a 256-token prefill chunk.
    - Duplex turn-taking is quantization-sensitive in long conversations; a tested W4A8 audio-only run remained in listen state for 36 seconds while the BF16 reference began speaking at the final chunk.
    evidence:
      examples:
      - examples_merak/llm/minicpm_o_4_5
      readme:
      - examples_merak/llm/minicpm_o_4_5/README.md
