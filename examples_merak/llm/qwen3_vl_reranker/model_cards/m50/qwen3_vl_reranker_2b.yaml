  presentation:
    summary: 主配置为同一AutoRound W4G64权重、两节点A16、head W8A16、视觉W8A8；5个动态视觉图加1个Prefill图。精度栏只记录该两节点方案在原713条完整候选集上的图像、文档、视频宏平均。
    demo:
      kind: python
      path: examples_merak/llm/qwen3_vl_reranker/hmonnx_demo.py
    limitations:
    - comparisons中w4a8_nodes2a16_headw8a16对应主workflow；仅0起编号L26 mlp.up_proj和L27 mlp.gate_proj激活A16，其余194个语言Linear保持A8。
    - 评分头为W8A16、视觉W8A8、FlashAttention Q8/K8/V8/P8、32768上下文和256-token Prefill chunk；全局基础scheme不改变已有W4整数载荷。
    - 结果仅为quick-mmeb-v1原713查询、9任务、66809候选对，复用Qwen3-VL-Embedding-2B冻结召回；不是官方全量MMEB分数。各模态3任务等权，delta为量化减BF16的百分点差。
    - BF16使用官方动态图像预算，HMONNX使用96/196/384/704/1536视觉token档位；指标差异包含量化侧视觉输入预算的影响。
    - 结果来自原生vLLM BF16与CUDA上的vLLM Merak HMONNX数值推理；未声明芯片真机性能或精度。
    - 本卡只记录三个模态宏平均；不填逐任务分数、九任务总均值或未测计算量。评测脚本见本模型evaluation/README列出的work_dirs归档，不使用通用默认CEval任务替代。
    evidence:
      examples:
      - examples_merak/llm/qwen3_vl_reranker
      - vllm_merak/examples/vllm_merak_reranker.py
      readme:
      - examples_merak/llm/qwen3_vl_reranker/README.md
      - examples_merak/llm/qwen3_vl_reranker/evaluation/ACTIVATION_A16_713_COMPARISON_20261028.md
