quant: null

export:
  target_device: XH2a
  model:
    type: XHKokoroModel

  # Four paired routes; no T/F Cartesian product.
  token_buckets: [32, 64, 128, 256]
  audio_seconds_buckets: [4, 8, 16, 32]
  opset: 17
  seed: 1234
  convert_hmonnx: true

  # HMONNX always decomposes LSTM at export. F0 stays on NPU.
  # F0 upsampling, phase preparation, CumSum and Sin use CPU FP32.
  components:
    text_duration:
      quant_type: w16a16_sefp
    frame_acoustic:
      quant_type: w16a16_sefp
    generator_istft:
      quant_type: w16a16_sefp
