# Target owns the shared head; no draft head bit override.
export:
  model:
    chip_arch: XH2a
    hf_model: null
    context_max_length: 2048
    prefill_chunk_length: 256
    use_cache: true
    num_logits_to_keep: 1
    linear_chunk_size: 64
    split_conv_cache: true
    normalize_force_fp32: false
    use_manual_depthwise_conv1d: false
    fuse_gdr_ops: true
    fuse_gdr_block_recurrent_ops: true
    quant_scheme:
      quant_type: w8a8h1_sefp
      nodes:
        lm_head:
          quant_type: w5a8h1_sefp
      ops: {}
    only_first_block: false
    model_type: Qwen3_5MoeForConditionalGeneration
    model_name: qwen3_6_35b_a3b
    max_pe_length: 262144
    support_long_context_over_fp16_limit: true
    linear_attention_mode: auto
    flash_attention:
      enable: false
      q_bits: 8
      k_bits: 8
      v_bits: 8
      s_bits: 8
      p_bits: 8
    visual_config:
      visual_input_mode: patches
      image_token_gears:
      - 96
      - 196
      - 384
      - 704
      - 1536
      image_token_capacity: 1536
      spatial_merge_size: 2
      quant_scheme:
        quant_type: w8a8h1_sefp
        ops: {}
    spec_decode_mode: mtp
    num_draft_tokens: 4
    output_post_norm_hidden: true
    mtp_config:
      hidden_size: 2048
      num_key_value_heads: 2
      head_dim: 256
      batch_size: 1
      input_sequence_length: 1
      max_pe_length: 262144
      use_cache: true
quant:
  algorithm: gptqmodel
  method: autoround
  output_format: gptqmodel_hf
  artifact_format: gptqmodel_hf
  bits: 4
  head:
    bits: 5
  group_size: 64
  rotation: false
  calibration:
    jsonl: xh2modelzoo://data/calib_data/NeelNanda-pile-10k.jsonl
    nsamples: 256
    seqlen: 2048
  runtime:
    batch_size: 8
    gradient_accumulate_steps: 1
    trust_remote_code: true
    device_map: '0'
    low_gpu_mem_usage: true
  seed: 42
  quant_nontext_module: false
  sym: true
  data_type: int_sym_xh
  iters: 400
  format: auto_round:gptqmodel
  auto_mixed_precision:
    candidates:
    - 4
    - 5
    - 8
    initial_bits: 5
    max_kl: 0.03
    max_ppl_increase: 0.02
    nsamples: 32
    seqlen: 512
    positions_per_sample: 64
    max_trials: 24
    seed: 42
    image_dataset: xh2modelzoo://data/calib_data/realworldqa_search_64.jsonl
    image_nsamples: 64
    image_seqlen: 2048
    image_max_pixels: 393216
  moe:
    expert_bits: 4
    expert_down_bits: 4
    attn_bits: 8
    shared_expert_bits: 8
  mtp:
    expert_bits: 4
    group_size: 64
    algorithm: inherit
