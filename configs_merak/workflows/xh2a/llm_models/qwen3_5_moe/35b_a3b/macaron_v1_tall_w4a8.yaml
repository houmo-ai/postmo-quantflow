quant:
  algorithm: gptqmodel
  method: autoround
  output_format: gptqmodel_hf
  artifact_format: gptqmodel_hf
  bits: 4
  group_size: 64
  rotation: false
  calibration:
    jsonl: xh2modelzoo://data/calib_data/NeelNanda-pile-10k.jsonl
    nsamples: 256
    seqlen: 2048
  runtime:
    batch_size: 8
    gradient_accumulate_steps: 1
    trust_remote_code: true
    device_map: '0'
    low_gpu_mem_usage: true
  seed: 42
  quant_nontext_module: false
  sym: true
  data_type: int_sym_xh
  iters: 400
  format: auto_round:gptqmodel
  moe:
    attn_bits: 8
    shared_expert_bits: 8

export:
  model:
    chip_arch: XH2a
    model_type: MacaronV1TallForConditionalGeneration
    hf_model: null
    model_name: macaron_v1_tall
    context_max_length: 2048
    prefill_chunk_length: 256
    max_pe_length: 262144
    support_long_context_over_fp16_limit: true
    use_cache: true
    num_logits_to_keep: 1
    linear_attention_mode: auto
    linear_chunk_size: 64
    split_conv_cache: true
    normalize_force_fp32: false
    use_manual_depthwise_conv1d: false
    fuse_gdr_ops: true
    fuse_gdr_block_recurrent_ops: true
    flash_attention:
      enable: false
      q_bits: 8
      k_bits: 8
      v_bits: 8
      s_bits: 8
      p_bits: 8
    quant_scheme:
      quant_type: w4a8h0_ssfp
      nodes:
        lm_head:
          quant_type: w8a8h1_sefp
      ops: {}
    visual_config:
      visual_input_mode: patches
      image_token_gears: [96, 196, 384, 704, 1536]
      image_token_capacity: 1536
      spatial_merge_size: 2
      quant_scheme:
        quant_type: w8a8h1_sefp
        ops: {}
    only_first_block: false

# The backbone uses W4A8 SSFP. Both non-routed and routed-expert LoRA use
# W8A8 SSFP; LoRA activations continue to use their parent operator format.
macaron_lora:
  adapters:
    available: [L0, L1, L2, L3]
  quantization:
    non_routed:
      quant_scheme: w8a8h0_ssfp
    routed_expert:
      quant_scheme: w8a8h0_ssfp
