export:
  model:
    chip_arch: XH2a
    hf_model: null
    context_max_length: 262144
    prefill_chunk_length: 256
    use_cache: true
    num_logits_to_keep: 1
    linear_chunk_size: 64
    split_conv_cache: true
    normalize_force_fp32: false
    use_manual_depthwise_conv1d: false
    fuse_gdr_ops: true
    fuse_gdr_block_recurrent_ops: true
    quant_scheme:
      quant_type: w8a8h1_sefp
      nodes:
        lm_head:
          quant_type: w4a8h1_sefp
      ops: {}
    only_first_block: false
    model_type: Qwen3_5MoeForConditionalGeneration
    model_name: qwen3_6_35b_a3b_head_w4_decode_safe85
    max_pe_length: 262144
    support_long_context_over_fp16_limit: true
    linear_attention_mode: auto
    flash_attention:
      enable: true
      q_bits: 8
      k_bits: 8
      v_bits: 8
      p_bits: 8
    visual_config:
      visual_input_mode: patches
      image_token_gears:
      - 96
      - 196
      - 384
      - 704
      - 1536
      image_token_capacity: 1536
      spatial_merge_size: 2
      quant_scheme:
        quant_type: w8a8h1_sefp
        ops: {}
    dynamic_prune:
      mode: decode
      algorithm: safe
      # Generate from weights + WikiText train unless explicit artifacts/cache are supplied.
      ace_priors_path: null
      exfold_artifact_path: null
      max_projection_loss: 1.0
      even_fold_policy: nearest_mass
      threshold: 0.85
      auto_s_scalar: true
      calibration:
        dataset: Salesforce/wikitext
        subset: wikitext-2-raw-v1
        split: train
        text_path: null
        nsamples: 128
        sequence_length: 2048
        batch_size: 1
      s_scalar_path: null
      s_scalar_compute_device: auto
quant:
  algorithm: gptqmodel
  method: autoround
  output_format: gptqmodel_hf
  artifact_format: gptqmodel_hf
  bits: 4
  head:
    bits: 4
  group_size: 64
  rotation: false
  calibration:
    jsonl: xh2modelzoo://data/calib_data/NeelNanda-pile-10k.jsonl
    nsamples: 256
    seqlen: 2048
  runtime:
    batch_size: 8
    gradient_accumulate_steps: 1
    trust_remote_code: true
    device_map: '0'
    low_gpu_mem_usage: true
  seed: 42
  quant_nontext_module: false
  sym: true
  data_type: int_sym_xh
  iters: 400
  format: auto_round:gptqmodel
  moe:
    attn_bits: 8
    shared_expert_bits: 8
