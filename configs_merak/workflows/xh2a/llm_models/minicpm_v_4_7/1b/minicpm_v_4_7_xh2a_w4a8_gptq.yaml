quant:
  algorithm: gptqmodel
  method: gptq
  bits: 4
  group_size: 64
  nsamples: 64
  sampling_seed: 0
  seqlen: 2048
  damp_percent: 0.01
  # Reuse the MiniCPM-V-4.5 Qwen-style mixed text corpus.
  calibration_jsonl: xh2modelzoo://data/calib_data/minicpm_v_4_5_qwen_mixed_295.jsonl
  # gptqmodel_source: /path/to/gptqmodel   # optional; or set GPTQMODEL_SOURCE
  # llm_backbone_dir: /path/to/prebuilt_qwen3_5_causal_lm  # optional reuse

export:
  model:
    chip_arch: XH2a
    model_type: MiniCPMV47ForConditionalGeneration
    hf_model: null
    model_name: minicpm_v_4_7_qwen3_5_1b
    context_max_length: 8192
    prefill_chunk_length: 256
    max_pe_length: 262144
    use_cache: true
    num_logits_to_keep: 1
    linear_chunk_size: 64
    split_conv_cache: true
    only_first_block: false
    visual_config: null
    # LLM W4A8 scheme; Vision stays W8A8 via components below.
    quant_scheme:
      quant_type: w4a8h0_ssfp
      nodes:
        lm_head:
          quant_type: w8a8h1_sefp
      ops:
        MatMul:
          act_scheme:
            bits: 16
            fp_mode: sefp
          act_schema_2:
            bits: 16
            fp_mode: sefp

  vision:
    patch_token_gears: [384, 784, 1536, 2816, 6144]
    keep_onnx: false

  components:
    vision_4x:
      enabled: true
      quant_type: w8a8h1_sefp
      validation_target: [30, 40]
    vision_16x:
      enabled: true
      quant_type: w8a8h1_sefp
      validation_target: [28, 40]
    llm:
      enabled: true
      quant_type: w4a8h0_ssfp
