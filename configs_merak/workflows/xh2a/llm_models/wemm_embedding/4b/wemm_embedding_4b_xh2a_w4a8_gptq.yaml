quant:
  # Qwen3.5 dispatches on algorithm; backend is not a workflow schema key.
  algorithm: gptqmodel  # GPTQModel library backend, not the quant method
  method: gptq  # GPTQ algorithm selected by this recipe
  output_format: gptqmodel_hf
  artifact_format: gptqmodel_hf
  # GPTQ recipe has no mode argument: Qwen3.5 VL module_tree targets only
  # model.language_model.layers; visual weights remain for W8A8 export.
  preset: full_vlm
  bits: 4
  group_size: 64
  rotation: false
  hessian_mse: true
  calibration:
    jsonl: gptqmodel://quantization/calibration/dense_ivsg/gen_data/Qwen3.5-27B.jsonl
    text_key: text
    nsamples: 256
    seqlen: 1024
  runtime:
    batch_size: 1
    trust_remote_code: true
    device_map: auto
    offload_to_disk: false
    wait_for_submodule_finalizers: true
  validation:
    # Qwen3.5 共享脚本的默认校验是 generate/PPL；WeMM 的质量
    # 通过独立的检索与 Native/HMONNX cosine 评测，因此跳过生成校验。
    check_quant_vision_demo: false
    check_rotation_ppl: false
    skip_inference: true
  seed: 42
  quant_nontext_module: false

export:
  model:
    chip_arch: XH2a
    model_type: WeMMEmbedding
    # 占位字段，导出时由 workflow 覆盖为真实模型目录
    hf_model: null
    model_name: wemm_embedding_4b
    context_max_length: 2048
    prefill_chunk_length: 256
    max_pe_length: 262144
    support_long_context_over_fp16_limit: true
    use_cache: true
    num_logits_to_keep: 0
    linear_attention_mode: auto
    linear_chunk_size: 64
    split_conv_cache: true
    normalize_force_fp32: false
    use_manual_depthwise_conv1d: false
    fuse_gdr_ops: true
    fuse_gdr_block_recurrent_ops: true
    quant_scheme:
      quant_type: w4a8h0_ssfp
      nodes:
        lm_head:
          quant_type: w8a8h1_sefp
      ops: {}
    visual_config:
      visual_input_mode: patches
      image_token_gears: [96, 196, 384, 704, 1536]
      image_token_capacity: 1536
      spatial_merge_size: 2
      quant_scheme:
        quant_type: w8a8h1_sefp
        ops: {}
    only_first_block: false
