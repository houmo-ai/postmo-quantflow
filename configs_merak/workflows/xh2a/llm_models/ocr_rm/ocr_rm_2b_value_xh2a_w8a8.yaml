quant: null
export:
  model:
    chip_arch: XH2a
    model_type: OcrRewardForSequenceClassification
    model_name: ocr_rm_2b_value
    hf_model: null
    context_max_length: 8192
    prefill_chunk_length: 256
    max_pe_length: 262144
    support_long_context_over_fp16_limit: true
    use_cache: true
    num_logits_to_keep: 1
    linear_attention_mode: auto
    linear_chunk_size: 64
    split_conv_cache: true
    fuse_gdr_ops: true
    fuse_gdr_block_recurrent_ops: true
    normalize_force_fp32: true
    cumsum_matmul_quant_config:
      act_schema: {fp_mode: sefp, man_bit: 8, hidden_bit: true}
      act_schema_2: {fp_mode: sefp, man_bit: 8, hidden_bit: true}
      # MatMul with a constant RHS becomes Linear in the SDK frontend.
      w_schema: {fp_mode: sefp, man_bit: 8, hidden_bit: true}
    quant_scheme:
      quant_type: w8a8h1_sefp
    visual_config:
      visual_input_mode: patches
      image_token_gears: [96, 384, 1536]
      image_token_capacity: 1536
      spatial_merge_size: 2
      quant_scheme:
        quant_type: w8a8h1_sefp
