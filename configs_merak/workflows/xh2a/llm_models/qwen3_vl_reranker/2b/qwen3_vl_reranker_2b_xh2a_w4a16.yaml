# Language Linear: AutoRound SSFP W4G64 weights and A16 activations.
# Scoring head stays W8A16 and vision W8A8; FlashAttention Q8/K8/V8/P8.
quant:
  algorithm: gptqmodel
  method: autoround
  output_format: gptqmodel_hf
  artifact_format: gptqmodel_hf
  bits: 4
  group_size: 64
  rotation: false
  calibration:
    dataset: xh2modelzoo://data/calib_data/NeelNanda-pile-10k.jsonl
    nsamples: 256
    seqlen: 2048
  runtime:
    batch_size: 8
    trust_remote_code: true
    low_gpu_mem_usage: true
  seed: 42
  quant_nontext_module: false
  sym: true
  data_type: int_sym_xh
  iters: 400
  format: auto_gptq
export:
  model:
    chip_arch: XH2a
    model_type: Qwen3VLForConditionalGeneration_reranker
    hf_model: null
    model_name: qwen3_vl_reranker_2b
    context_max_length: 32768
    prefill_chunk_length: 256
    max_pe_length: 262144
    flash_attention:
      enable: true
      q_bits: 8
      k_bits: 8
      v_bits: 8
      p_bits: 8
    use_cache: true
    num_logits_to_keep: 1
    quant_scheme:
      quant_type: w8a16h1_sefp
      nodes:
        lm_head:
          quant_type: w8a16h1_sefp
    visual_config:
      visual_input_mode: patches
      image_token_gears: [96, 196, 384, 704, 1536]
      image_token_capacity: 1536
      spatial_merge_size: 2
      quant_scheme:
        quant_type: w8a8h1_sefp
    only_first_block: false
