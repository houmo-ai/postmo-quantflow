quant: null

export:
  model:
    chip_arch: XH2a
    model_type: Spark2_5ForCausalLM
    # 该字段仅用作占位，实际会在导出前实时覆盖
    hf_model: null
    # 按照 HuggingFace 上的模型名称填写，全部小写，'.' 和 '-' 改成 '_'
    model_name: xh_token_spark_1_7b
    context_max_length: 131072
    prefill_chunk_length: 256
    max_pe_length: 1048576
    use_cache: true
    # SlidingWindowLLMInputProcessor 尚不支持 PageAttention ABI。
    enable_page_attention: false
    num_logits_to_keep: 1
    flash_attention:
      enable: true
      q_bits: 8
      k_bits: 8
      v_bits: 8
      p_bits: 8
    quant_scheme:
      quant_type: w8a8h1_sefp
      nodes:
        lm_head:
          quant_type: w8a8h1_sefp
      ops:
        MatMul:
          act_scheme:
            bits: 16
            fp_mode: sefp
          act_schema_2:
            bits: 16
            fp_mode: sefp
    only_first_block: false
